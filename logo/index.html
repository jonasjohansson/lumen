<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen Logo Lab</title>
<meta name="description" content="Blurred-dot lettering for Lumen Project: type Lp or the full name, drag the letter skeletons, tune the blobs, the blur and the shadow where one letter passes under the next, then export PNG or SVG.">
<link rel="icon" href="../favicon.svg">
<style>
@font-face { font-family: "Barlow"; font-weight: 500; font-display: swap; src: url(../fonts/barlow-500-latin.woff2) format("woff2"); }
@font-face { font-family: "Barlow"; font-weight: 600; font-display: swap; src: url(../fonts/barlow-600-latin.woff2) format("woff2"); }
@font-face { font-family: "Barlow"; font-weight: 700; font-display: swap; src: url(../fonts/barlow-700-latin.woff2) format("woff2"); }

:root {
  --font: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --paper: #0a0a0a; --panel: #111; --ink: #f2f2f2; --ink-dim: #8a8a8a; --line: #242424; --accent: #e0e0c7; --track: #2a2a2a;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --paper: #f4f4f1; --panel: #fff; --ink: #111; --ink-dim: #6c6c6c; --line: #e2e2e2; --accent: #0645b2; --track: #ddd;
    color-scheme: light;
  }
}
:root[data-theme="light"] { --paper: #f4f4f1; --panel: #fff; --ink: #111; --ink-dim: #6c6c6c; --line: #e2e2e2; --accent: #0645b2; --track: #ddd; color-scheme: light; }
:root[data-theme="dark"]  { --paper: #0a0a0a; --panel: #111; --ink: #f2f2f2; --ink-dim: #8a8a8a; --line: #242424; --accent: #e0e0c7; --track: #2a2a2a; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font: 500 14px/1.4 var(--font); background: var(--paper); color: var(--ink);
  display: grid; grid-template-columns: 1fr 340px; grid-template-rows: 100vh;
}
@media (max-width: 820px) {
  body { grid-template-columns: 1fr; grid-template-rows: auto auto; height: auto; }
  #stage { height: 60vh; }
}

#stage { position: relative; overflow: hidden; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
#stage.editing canvas { cursor: crosshair; }
#hud {
  position: absolute; left: 16px; top: 14px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  font-size: 12px; color: var(--ink-dim); pointer-events: none;
}
#hud b { color: var(--ink); }
#stat { position: absolute; left: 16px; bottom: 12px; font-size: 12px; color: var(--ink-dim); font-variant-numeric: tabular-nums; pointer-events: none; }

aside { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 16px 16px 40px; }
@media (max-width: 820px) { aside { border-left: 0; border-top: 1px solid var(--line); } }

h1 { font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; margin: 4px 0 12px; }
.text { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.text input { flex: 1 1 100%; }
.text button { flex: 1 1 auto; }
.text input { flex: 1; height: 36px; padding: 0 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink); font: 600 16px var(--font); }
.text button { height: 36px; padding: 0 10px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--ink); font: 600 12px var(--font); cursor: pointer; }

details { border-top: 1px solid var(--line); padding: 8px 0; }
details:last-of-type { border-bottom: 1px solid var(--line); }
summary {
  cursor: pointer; list-style: none; font-weight: 700; font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-dim); display: flex; justify-content: space-between; padding: 4px 0; user-select: none;
}
summary::after { content: "+"; font-weight: 500; }
details[open] summary::after { content: "–"; }
details[open] summary { color: var(--ink); }

.row { display: grid; grid-template-columns: 1fr 52px; gap: 6px 10px; align-items: center; padding: 6px 0; }
.row output { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-dim); font-size: 12px; }
.row input[type=range] { grid-column: 1 / -1; width: 100%; margin: 0; height: 22px; accent-color: var(--accent); }
.row.check { grid-template-columns: 1fr auto; }
.row.check input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); }
.row.color input[type=color] { width: 52px; height: 24px; border: 1px solid var(--line); border-radius: 4px; padding: 0; background: none; }
.row.select select { height: 28px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink); font: 600 12px var(--font); }
.row.select { grid-template-columns: 1fr auto; }

textarea {
  width: 100%; min-height: 160px; margin-top: 6px; padding: 8px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--paper); color: var(--ink); font: 12px/1.4 ui-monospace, Menlo, monospace; resize: vertical;
}
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.actions button, .actions select {
  height: 34px; padding: 0 12px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--paper); color: var(--ink); font: 600 13px var(--font); cursor: pointer; flex: 1 1 auto;
}
.actions button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.actions button:hover { border-color: var(--ink-dim); }
.hint { color: var(--ink-dim); font-size: 12px; margin: 10px 0 0; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
.presets button { height: 28px; padding: 0 10px; border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--ink); font: 600 12px var(--font); cursor: pointer; }
.presets button:hover { border-color: var(--ink-dim); }
</style>
</head>
<body>

<div id="stage">
  <canvas id="c"></canvas>
  <div id="hud"><b>Lumen</b> logo lab</div>
  <div id="stat"></div>
</div>

<aside>
  <h1>Lp halftone</h1>
  <div class="text">
    <input id="text" value="Lp" spellcheck="false" aria-label="Text">
    <button data-t="Lp" data-preset="Reference">Lp</button>
    <button data-t="Lumen" data-preset="Word mark">Lumen</button>
    <button data-t="Lumen Project" data-preset="Word mark">Lumen Project</button>
    <button data-t="Lumen" data-preset="Snake circle">Circle</button>
    <button data-t="Lumen Project" data-preset="Project circle">Project circle</button>
    <button data-t="*" data-preset="Lu-man">Lu-man</button>
    <button data-t="★" data-preset="Lu-star">Lu-star</button>
  </div>
  <div class="presets" id="presets"></div>
  <div id="controls"></div>
  <div class="actions">
    <button class="primary" id="png">PNG</button>
    <button id="svg">SVG</button>
    <select id="pngSize" title="PNG width">
      <option value="1024">1024 px</option>
      <option value="2048" selected>2048 px</option>
      <option value="4096">4096 px</option>
    </select>
  </div>
  <div class="actions">
    <button id="copy">Copy settings</button>
    <button id="reset">Reset all</button>
  </div>
  <p class="hint">Everything auto-saves in this browser. Turn on <b>Edit letters</b> to drag the skeleton points on the canvas (a change edits that letter everywhere), or edit the letter JSON below it. Later letters sit on top; the shadow is where an earlier letter passes under one.</p>
</aside>

<script>
// ============ letter skeletons ============
// Logo units, baseline y = 0, y up. x-height ≈ 4.4, ascender 7.2, descender 2.6, drawn with a stroke ≈ 1.1.
// A glyph = { adv, strokes[] }, stroke = { pts:[[x,y],…], smooth?:true } or { ring:[cx, cy, r] }.
// A single point stroke { pts:[[x,y]] } is a round dot of stroke width.
// entry / exit: where a cursive join arrives / leaves (defaults: first point of the first line stroke, last point of
// the last stroke; exit:false = no join out of this letter). tail:true marks a stroke that is replaced by the join.
// width: [start, end] tapers a stroke, in multiples of the stroke width ("*" is the Lu-man mascot).
// entryVia: points (this letter's coordinates) a join passes just before it enters this letter.
// joins: { "<next char>": [[x,y],…], "*": […] } — hand-drawn via points (this letter's coordinates) for a pair,
// the way a script font draws each connection for its pair rather than one rule for all.
const DEFAULT_GLYPHS = {
  "L": { adv: 3.3, entry: [0.3,0.3], strokes: [ { pts: [[0.2,6.9],[0.05,3.4],[0,1.2],[0.3,0.35],[1.2,0],[7.6,0]], smooth: true, tail: true } ] },
  "p": { adv: 4.6, entry: [1.0,0.1], exit: [0,-2.4], joins: { "*": [[1.3,-1.7],[3.1,-2.15]] }, strokes: [ { pts: [[1.0,0.1],[2.3,0.2],[3.7,0.9],[4.2,2.3],[3.6,3.8],[2.1,4.4],[0.6,3.8],[0,2.3],[0,0],[0,-2.4]], smooth: true } ] },
  "P": { adv: 4.6, entry: [1.0,0.1], exit: [0,-2.4], joins: { "*": [[1.3,-1.7],[3.1,-2.15]] }, strokes: [ { pts: [[1.0,0.1],[2.3,0.2],[3.7,0.9],[4.2,2.3],[3.6,3.8],[2.1,4.4],[0.6,3.8],[0,2.3],[0,0],[0,-2.4]], smooth: true } ] },
  "u": { adv: 4.6, strokes: [ { pts: [[0,4.4],[0,1.3],[0.9,0],[2.2,0],[3.1,1.3],[3.1,4.4]], smooth: true }, { pts: [[3.1,4.4],[3.1,0]] } ] },
  "m": { adv: 7.3, entry: [0,0], strokes: [ { pts: [[0,4.4],[0,0]] },
                               { pts: [[0,2.5],[0.6,4.2],[1.7,4.4],[2.7,3.6],[2.9,2.4],[2.9,0]], smooth: true },
                               { pts: [[2.9,2.5],[3.5,4.2],[4.6,4.4],[5.6,3.6],[5.8,2.4],[5.8,0]], smooth: true } ] },
  "n": { adv: 4.4, entry: [0,0], strokes: [ { pts: [[0,4.4],[0,0]] }, { pts: [[0,2.5],[0.6,4.2],[1.7,4.4],[2.7,3.6],[2.9,2.4],[2.9,0]], smooth: true } ] },
  "e": { adv: 4.6, entry: [0.3,2.3], exit: [3.3,0.6], strokes: [ { pts: [[0.3,2.3],[3.3,2.3],[3.3,3.4],[2.2,4.4],[0.9,4.0],[0,2.5],[0.4,0.7],[1.8,0],[3.3,0.5]], smooth: true } ] },
  "r": { adv: 3.4, entry: [0,0], exit: [2.5,4.0], strokes: [ { pts: [[0,0],[0,2.9],[0.45,3.95],[1.5,4.4],[2.5,4.0]], smooth: true } ] },
  "o": { adv: 5.4, entry: [1.1,4.1], exit: [3.3,4.1], strokes: [ { ring: [2.2, 2.2, 2.2] } ] },
  "j": { adv: 2.4, entry: [0,4.4], exit: [1.5,0.6], strokes: [ { pts: [[0,4.4],[0,-0.9],[-0.35,-2.2],[-1.2,-2.6],[-1.6,-2.0],[-0.9,-0.9],[0.4,-0.1],[1.5,0.6]], smooth: true, tail: true }, { pts: [[0,6.3]] } ] },
  "c": { adv: 4.6, entry: [0.35,3.2], exit: [3.2,0.7], joins: { "t": [[3.95,1.7],[4.2,3.75]] }, strokes: [ { pts: [[2.9,3.9],[2.1,4.4],[0.9,4.0],[0.1,2.4],[0.4,0.8],[1.6,0],[3.2,0.7]], smooth: true } ] },
  "t": { adv: 3.6, entry: [-0.4,4.4], strokes: [ { pts: [[0.9,6.0],[0.9,0.9],[1.6,0],[2.6,0.5]], smooth: true }, { pts: [[-0.4,4.4],[2.4,4.4]] } ] },
  "i": { adv: 2.2, strokes: [ { pts: [[0,4.4],[0,0]] }, { pts: [[0,6.3]] } ] },
  "l": { adv: 2.2, strokes: [ { pts: [[0,7.2],[0,0]] } ] },
  "a": { adv: 4.8, entry: [0,2.2], strokes: [ { ring: [1.9, 2.2, 1.9] }, { pts: [[3.8,4.4],[3.8,0]] } ] },
  "s": { adv: 4.0, strokes: [ { pts: [[2.9,3.8],[1.8,4.4],[0.6,3.8],[0.9,2.6],[2.2,2.0],[3.0,1.0],[2.2,0],[0.4,0.3]], smooth: true } ] },
  " ": { adv: 3.0, strokes: [] },
  "*": { adv: 11, exit: false, strokes: [
    { pts: [[0,3.3],[-1.9,3.9],[-3.5,5.0],[-4.7,6.5]], smooth: true, width: [3.0, 0.25] },
    { pts: [[0,3.3],[1.9,3.9],[3.5,5.0],[4.7,6.5]], smooth: true, width: [3.0, 0.25] },
    { pts: [[0,3.3],[-0.9,1.0],[-1.8,-1.2],[-2.5,-3.3]], smooth: true, width: [3.0, 0.3] },
    { pts: [[0,3.3],[0.9,1.0],[1.8,-1.2],[2.5,-3.3]], smooth: true, width: [3.0, 0.3] },
    { pts: [[0,2.4],[0,4.4]], width: [3.4, 2.4] },
    { ring: [0, 7.0, 1.55] } ] },
  "★": { adv: 12, exit: false, strokes: [
    { pts: [[0,2.6],[0.0,4.95],[0.0,7.3]], smooth: true, width: [3.4, 0.75] },
    { pts: [[0,2.6],[2.41,3.57],[4.82,4.55]], smooth: true, width: [3.4, 0.3] },
    { pts: [[0,2.6],[-2.41,3.57],[-4.82,4.55]], smooth: true, width: [3.4, 0.3] },
    { pts: [[0,2.6],[1.36,-0.07],[2.72,-2.75]], smooth: true, width: [3.4, 0.35] },
    { pts: [[0,2.6],[-1.36,-0.07],[-2.72,-2.75]], smooth: true, width: [3.4, 0.35] } ] },
};

// ============ parameter spec ============
const SPEC = [
  { group: "Letters", open: true, items: [
    { k: "stroke",   l: "Stroke width",     min: 0.4, max: 2.4, step: 0.01, d: 1.0 },
    { k: "tracking", l: "Letter spacing",   min: -2,  max: 3,   step: 0.05, d: 0 },
    { k: "slant",    l: "Slant",            min: -0.4, max: 0.6, step: 0.01, d: 0 },
    { k: "connect",  l: "Connect letters (one stroke)", type: "check", d: true },
    { k: "joinFade", l: "Join fade-out",    min: 0,   max: 1,   step: 0.01, d: 0.6 },
    { k: "wobble",   l: "Hand (bend strokes)", min: 0, max: 1, step: 0.01, d: 0.25 },
    { k: "stack",    l: "On top",           type: "select", opts: { later: "Later letter", earlier: "Earlier letter" }, d: "later" },
    { k: "edit",     l: "Edit letters",     type: "check", d: false },
  ]},
  { group: "Circle (snake)", open: true, items: [
    { k: "circle",    l: "Wrap word around a circle", type: "check", d: false },
    { k: "circleCover", l: "Word covers (of the ring)", min: 0.3, max: 1, step: 0.01, d: 0.45 },
    { k: "circleBend",  l: "Bend letters with the ring", min: 0, max: 1, step: 0.01, d: 0.25 },
    { k: "circleH",     l: "Letter height",   min: 0.4, max: 1.3, step: 0.01, d: 0.85 },
    { k: "wordGap",   l: "Gap between words", min: 0, max: 8, step: 0.1, d: 0 },
    { k: "circleBridge", l: "Join across the word gap", type: "check", d: false },
    { k: "circleRot", l: "Rotate",           min: -180, max: 180, step: 1, d: 0 },
  ]},
  { group: "Blobs", open: true, items: [
    { k: "spacing", l: "Grid spacing",      min: 0.1, max: 0.8, step: 0.005, d: 0.4 },
    { k: "dotMax",  l: "Max blob (× spacing)", min: 0.2, max: 0.9, step: 0.005, d: 0.47 },
    { k: "soft",    l: "Edge softness",     min: 0.02, max: 1.5, step: 0.01, d: 0.35 },
    { k: "gamma",   l: "Size curve",        min: 0.2, max: 3,   step: 0.01, d: 0.75 },
    { k: "minDot",  l: "Smallest blob",     min: 0,   max: 0.4, step: 0.005, d: 0.06 },
    { k: "gridX",   l: "Grid offset X",     min: 0,   max: 1,   step: 0.01, d: 0 },
    { k: "gridY",   l: "Grid offset Y",     min: 0,   max: 1,   step: 0.01, d: 0 },
    { k: "sizeJit", l: "Size variation",    min: 0,   max: 1,   step: 0.01, d: 0 },
    { k: "posJit",  l: "Position scatter",  min: 0,   max: 1,   step: 0.01, d: 0 },
    { k: "seed",    l: "Seed",              min: 1,   max: 99,  step: 1,    d: 7 },
    { k: "stagger", l: "Stagger rows",      type: "check", d: false },
  ]},
  { group: "Blur (optional)", open: false, items: [
    { k: "blur",     l: "Blur (× blob)",    min: 0,   max: 2,   step: 0.01, d: 0 },
    { k: "glow",     l: "Glow spread",      min: 0,   max: 6,   step: 0.05, d: 2.0 },
    { k: "glowStr",  l: "Glow strength",    min: 0,   max: 1,   step: 0.01, d: 0 },
  ]},
  { group: "Depth (under / over)", open: true, items: [
    { k: "shadowW",   l: "Shadow width",    min: 0,   max: 2.5, step: 0.01, d: 0.35 },
    { k: "shadowStr", l: "Shadow strength", min: 0,   max: 1,   step: 0.01, d: 0.5 },
    { k: "shadowSoft",l: "Shadow softness", min: 0.3, max: 3,   step: 0.01, d: 1.0 },
    { k: "shadowDx",  l: "Shadow offset X", min: -1.2, max: 1.2, step: 0.01, d: 0 },
    { k: "shadowDy",  l: "Shadow offset Y", min: -1.2, max: 1.2, step: 0.01, d: 0.2 },
    { k: "lift",      l: "Top letter lift", min: 0.8, max: 1.3, step: 0.005, d: 1.0 },
  ]},
  { group: "Colour", open: false, items: [
    { k: "fg", l: "Blobs",      type: "color", d: "#ece9df" },
    { k: "bg", l: "Background", type: "color", d: "#000000" },
    { k: "transparent", l: "Transparent background (exports)", type: "check", d: true },
    { k: "pad", l: "Padding",   min: 0, max: 3, step: 0.05, d: 1.2 },
  ]},
];
const PRESETS = {
  "Reference": {},
  "Softer edges": { soft: 0.7, gamma: 0.8 },
  "Hard edges": { soft: 0.1, gamma: 1 },
  "Blurred": { blur: 0.5, glow: 3, glowStr: 0.35 },
  "Scattered": { sizeJit: 0.35, posJit: 0.2 },
  "Project circle": { circle: true, connect: true, circleCover: 0.88, wordGap: 2.5, circleBridge: true, circleH: 0.8, circleBend: 1, stroke: 0.75, spacing: 0.2, soft: 0.28, tracking: 0.5, slant: 0, wobble: 0, joinFade: 0.2 },
  "Snake circle": { circle: true, connect: true, circleCover: 1, circleH: 0.42, circleBend: 1, stroke: 0.7, spacing: 0.18, soft: 0.26, tracking: 0.8, slant: 0, wobble: 0, joinFade: 0.15 },
  "Lu-man": { connect: false, stroke: 0.75, spacing: 0.22, soft: 0.3, gamma: 0.8, minDot: 0.05, wobble: 0, slant: 0 },
  "Lu-star": { connect: false, stroke: 0.8, spacing: 0.22, soft: 0.38, gamma: 0.8, minDot: 0.05, wobble: 0, slant: 0 },
  "Word mark": { connect: true, stroke: 0.8, spacing: 0.22, soft: 0.3, tracking: 0.3, slant: 0.15, wobble: 0.3 },
  "Geometric": { wobble: 0, connect: false },
  "Deep shadow": { shadowW: 1.4, shadowStr: 1, shadowSoft: 0.9, shadowDy: 0.35, lift: 1.08 },
  "Flat": { shadowW: 0, shadowStr: 0, lift: 1 },
  "Inverted": { fg: "#000000", bg: "#ffffff" },
};
const DEFAULTS = {}; SPEC.forEach(g => g.items.forEach(i => DEFAULTS[i.k] = i.d));
const KEY = "lumen-logo-lab-v23", GKEY = "lumen-logo-lab-glyphs-v25", TKEY = "lumen-logo-lab-text-v2";
let P = Object.assign({}, DEFAULTS);
let G = JSON.parse(JSON.stringify(DEFAULT_GLYPHS));
let TEXT = "Lp";
try {
  Object.assign(P, JSON.parse(localStorage.getItem(KEY) || "{}"));
  const g = JSON.parse(localStorage.getItem(GKEY) || "null"); if (g) G = g;
  const t = localStorage.getItem(TKEY); if (t) TEXT = t;
} catch (e) {}
P.edit = false;

// ============ controls ============
const controls = document.getElementById("controls"), inputs = {};
SPEC.forEach(g => {
  const d = document.createElement("details"); d.open = g.open;
  d.innerHTML = `<summary>${g.group}</summary>`;
  g.items.forEach(i => {
    const row = document.createElement("div"); row.className = "row" + (i.type ? " " + i.type : "");
    let el;
    if (i.type === "check") {
      row.innerHTML = `<label for="in-${i.k}">${i.l}</label><input id="in-${i.k}" type="checkbox">`;
      el = row.querySelector("input"); el.checked = !!P[i.k];
      el.oninput = () => { P[i.k] = el.checked; changed(); };
    } else if (i.type === "color") {
      row.innerHTML = `<label for="in-${i.k}">${i.l}</label><input id="in-${i.k}" type="color">`;
      el = row.querySelector("input"); el.value = P[i.k];
      el.oninput = () => { P[i.k] = el.value; changed(); };
    } else if (i.type === "select") {
      row.innerHTML = `<label for="in-${i.k}">${i.l}</label><select id="in-${i.k}">${Object.entries(i.opts).map(([v, t]) => `<option value="${v}">${t}</option>`).join("")}</select>`;
      el = row.querySelector("select"); el.value = P[i.k];
      el.oninput = () => { P[i.k] = el.value; changed(); };
    } else {
      row.innerHTML = `<label for="in-${i.k}">${i.l}</label><output></output><input id="in-${i.k}" type="range" min="${i.min}" max="${i.max}" step="${i.step}">`;

  ctx.lineWidth = 1; ctx.strokeStyle = "rgba(255,80,80,.9)"; ctx.setLineDash([4, 4]);
  for (const I of inst) {
    for (const s of I.segs) { ctx.beginPath(); ctx.moveTo(X(s[0]), Y(s[0])); ctx.lineTo(X(s[1]), Y(s[1])); ctx.stroke(); }
    for (const r of I.rings) { ctx.beginPath(); ctx.save(); ctx.transform(1, 0, -r[3], 1, r[3] * cy, 0); const ux = (r[0] - r[1] * r[3]); ctx.arc(cx + ux * k, cy - r[1] * k, r[2] * k, 0, Math.PI * 2); ctx.restore(); ctx.stroke(); }
  }
  ctx.setLineDash([]);
  // handles
  for (const H of handles(p, inst)) {
    ctx.beginPath(); ctx.arc(H.sx, H.sy, 5, 0, Math.PI * 2);
    ctx.fillStyle = H.kind === "r" ? "#ffd166" : "#ff5050"; ctx.fill();
  }
  ctx.restore();
}
// Every draggable point in screen space, with a setter back into the glyph definition.
function handles(p, inst) {
  if (!view) return [];
  const { k, cx, cy } = view, out = [];
  inst.forEach(I => {
    const S = q => { const w = I.frame ? I.frame.f(q) : q; return [cx + w[0] * k, cy - w[1] * k]; };
    const local = (x, y) => I.frame ? I.frame.inv(x, y) : [x, y];
    I.g.strokes.forEach((st, si) => {
      if (st.ring) {
        const [rx, ry, rr] = st.ring;
        const c = [rx + I.ox + ry * p.slant, ry], sc = S(c), sr = S([c[0] + rr, c[1]]);
        out.push({ sx: sc[0], sy: sc[1], kind: "c", set: (x, y) => { [x, y] = local(x, y); st.ring[0] = x - I.ox - y * p.slant; st.ring[1] = y; } });
        out.push({ sx: sr[0], sy: sr[1], kind: "r", set: (x, y) => { [x, y] = local(x, y); st.ring[2] = Math.max(0.2, Math.hypot(x - c[0], y - c[1])); } });
      } else st.pts.forEach((q, qi) => {
        const sq = S([q[0] + I.ox + q[1] * p.slant, q[1]]);
        out.push({ sx: sq[0], sy: sq[1], kind: "p", set: (x, y) => { [x, y] = local(x, y); q[0] = x - I.ox - y * p.slant; q[1] = y; } });
      });
    });
  });
  return out;
}
function draw() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) { canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const t0 = performance.now();
  stage.style.background = P.bg;
  const n = render(ctx, w, h, P, P.edit || peek);
  stat.textContent = `${n} blobs · ${(performance.now() - t0).toFixed(0)} ms` + (P.edit ? " · drag the red points, yellow sets a ring radius" : "");
  if (glyphsDirty) { glyphTa.value = glyphJSON(); glyphsDirty = false; }
}
new ResizeObserver(draw).observe(canvas);
window.addEventListener("keydown", e => { if (e.key.toLowerCase() === "g" && !peek && e.target === document.body) { peek = true; draw(); } });
window.addEventListener("keyup", e => { if (e.key.toLowerCase() === "g") { peek = false; draw(); } });

// dragging skeleton points
let drag = null;
canvas.addEventListener("pointerdown", e => {
  if (!P.edit || !view) return;
  const r = canvas.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  let best = null, bd = 12;
  for (const H of handles(P, view.inst)) { const d = Math.hypot(H.sx - mx, H.sy - my); if (d < bd) { bd = d; best = H; } }
  if (best) { drag = best; canvas.setPointerCapture(e.pointerId); }
});
canvas.addEventListener("pointermove", e => {
  if (!drag || !view) return;
  const r = canvas.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  let x = (mx - view.cx) / view.k, y = (view.cy - my) / view.k;
  if (!e.altKey) { x = Math.round(x * 20) / 20; y = Math.round(y * 20) / 20; }
  drag.set(x, y); glyphsDirty = true; changed();
});
canvas.addEventListener("pointerup", () => { drag = null; });

// ============ export ============
function download(name, blob) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function slug() { return "lumen-" + (TEXT.trim() === "*" ? "luman" : TEXT.trim() === "★" ? "lustar" : TEXT.trim().toLowerCase().replace(/[^a-z0-9]+/g, "-") || "logo"); }
document.getElementById("png").onclick = () => {
  const size = +document.getElementById("pngSize").value;
  const B = bounds(P, layout(P)), ar = (B.x1 - B.x0) / (B.y1 - B.y0);
  const w = size, h = Math.round(size / ar);
  const off = document.createElement("canvas"); off.width = w; off.height = h;
  render(off.getContext("2d"), w, h, P, false);
  off.toBlob(b => download(slug() + ".png", b), "image/png");
  draw();
};
document.getElementById("svg").onclick = () => {
  const { dots: D, bounds: B } = dots(P);
  const k = 100, W = (B.x1 - B.x0) * k, H = (B.y1 - B.y0) * k, f = v => (+v.toFixed(2)).toString();
  const blobU = P.spacing * P.dotMax * k;
  const circles = D.map(d => `<circle cx="${f((d.x - B.x0) * k)}" cy="${f((B.y1 - d.y) * k)}" r="${f(d.r * k)}"/>`).join("\n");
  const defs = `<defs>
<filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="${f(P.blur * blobU)}"/></filter>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="${f(P.glow * blobU)}"/></filter>
</defs>`;
  const glow = P.glow > 0 && P.glowStr > 0 ? `<g fill="${P.fg}" opacity="${f(P.glowStr)}" filter="url(#glow)">\n${circles}\n</g>\n` : "";
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${f(W)} ${f(H)}" width="${f(W)}" height="${f(H)}">
${defs}
${P.transparent ? "" : `<rect width="100%" height="100%" fill="${P.bg}"/>\n`}${glow}<g fill="${P.fg}"${P.blur > 0 ? ' filter="url(#blur)"' : ""}>
${circles}
</g>
</svg>`;
  download(slug() + ".svg", new Blob([svg], { type: "image/svg+xml" }));
};
function flash(msg) { stat.textContent = msg; setTimeout(draw, 1500); }

stage.classList.toggle("editing", !!P.edit);
draw();
</script>
</body>
</html>
